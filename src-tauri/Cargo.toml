[package]
name = "book-companion"
version = "0.1.0"
description = "Offline reading companion: photograph book pages, OCR them locally, and work through them one paragraph at a time"
authors = ["rec0n"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "book_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# rustls-tls rather than the default native-tls: Ollama is plain HTTP on localhost,
# but the optional dictionary downloads (kaikki/WordNet) are HTTPS and rustls avoids
# a system TLS dependency entirely.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "charset",
    "http2",
] }
tokio = { version = "1.53.1", features = ["full"] }
image = "0.25.10"
kamadak-exif = "0.6.1"
anyhow = "1.0.104"
thiserror = "2.0.20"
base64 = "0.23.1"
futures-util = "0.3.33"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-store = "2.4.4"
# Pure-Rust HEIC/HEIF decoder. Chosen over libheif-rs specifically to avoid a
# C toolchain dependency in the Windows build. `parallel` matters here: an
# iPhone page photo is ~12MP and tile decoding dominates import time.
heic = { version = "0.1.6", features = ["parallel"] }
sha2 = "0.11.0"
epub = "2.1.5"
pdf-extract = "0.12.0"
scraper = "0.27.0"
docx-rs = "0.4.22"
zip = "8.6.0"

