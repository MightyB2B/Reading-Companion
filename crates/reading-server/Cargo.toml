[package]
name = "reading-server"
version = "0.1.0"
description = "HTTP service in front of the Reading Companion engine: accounts, libraries, and the OCR pipeline."
edition = "2021"

[[bin]]
name = "reading-server"
path = "src/main.rs"

[dependencies]
reading-core = { workspace = true }

axum = { workspace = true }
axum-server = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
